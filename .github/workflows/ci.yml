name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ml_user
          POSTGRES_PASSWORD: ml_pass
          POSTGRES_DB: ml_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ml_user:ml_pass@localhost:5432/ml_platform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with flake8
        run: flake8 app/ --max-line-length=120 --ignore=E302,W503

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest tests/ -v
